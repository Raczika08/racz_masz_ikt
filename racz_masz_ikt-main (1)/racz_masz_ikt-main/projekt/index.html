<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmezz</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="p-5">
        <header class="mb-5">
            <h1 class="text-center text-white">Üdvözöljük a Filmezz weboldalán!</h1>
        </header>
        <main class="my-5">
            <div class="container w-50">
                <form class="bejelentkezes mt-5 px-5 pt-5 pb-2">
                    <h2 class="text-center mb-5 text-warning rosszAdatok"></h2>
                    <h2 class="text-center mb-5">Bejelentkezés</h2>
                    <div class="mb-4">
                        <label for="exampleFormControlInput1" class="form-label mb-3 fs-3">Felhasználónév</label>
                        <input type="text" class="form-control felhasznalonev">
                    </div>
                    <div class="mb-5">
                        <label for="exampleFormControlInput1" class="form-label mb-3 fs-3">Jelszó</label>
                        <input type="password" class="form-control jelszo">
                    </div>
                    <div class="mb-4 text-center">
                        <button type="button" class="btn btn-info text-white fs-5 mb-2" onclick="valtas()">Még nincs
                            fiókom</button>
                        <button type="button" class="btn btn-primary mb-2 fs-5"
                            onclick="bejelentkezes()">Bejelentkezés</button>
                    </div>
                </form>
                <form class="fiokLetrehozas mt-5 px-5 pt-5 pb-2 d-none">
                    <h2 class="text-center mb-5 text-warning rosszAdatok"></h2>
                    <h2 class="text-center mb-5">Fiók létrehozása</h2>
                    <div class="mb-4">
                        <label for="exampleFormControlInput1" class="form-label mb-3 fs-3">Felhasználónév</label>
                        <input type="text" class="form-control felhasznalonev">
                    </div>
                    <div class="mb-4">
                        <label for="exampleFormControlInput1" class="form-label mb-3 fs-3">Jelszó</label>
                        <input type="password" class="form-control jelszo">
                    </div>
                    <div class="mb-5">
                        <label for="exampleFormControlInput1" class="form-label mb-3 fs-3">Jelszó megerősítése</label>
                        <input type="password" class="form-control jelszomegerosites">
                    </div>
                    <div class="mb-4 text-center">
                        <button type="button" class="btn btn-primary fs-5" onclick="visszavaltas()">Fiók
                            létrehozása</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <footer class="text-white">
        <section class="mt-2">
            <div class="d-flex justify-content-evenly pt-5">
                <div>
                    <ul>
                        <li><a href="">Adatvédelem</a></li>
                        <li><a href="">ASZF</a></li>
                        <li><a href="">Szerződési jog</a></li>
                        <li><a href="">GYIK</a></li>
                    </ul>
                </div>
                <div>
                    <ul>
                        <li><a href="">Elállás</a></li>
                        <li><a href="">Ügyfélszolgálat</a></li>
                        <li><a href="">Jogi garancia</a></li>
                        <li><a href="">Fiók</a></li>
                    </ul>
                </div>
                <div>
                    <ul>
                        <li><i class="bi bi-instagram"></i><a target="_blank" class="ps-2"
                                href="https://www.instagram.com/">@Filmezz</a></li>
                        <li><i class="bi bi-facebook"></i><a target="_blank" class="ps-2"
                                href="https://www.facebook.com/">@Filmezz</a></li>
                        <li><i class="bi bi-tiktok"></i><a target="_blank" class="ps-2"
                                href="https://www.tiktok.com/">@Filmezz</a></li>
                        <li><i class="bi bi-twitter-x"></i><a target="_blank" class="ps-2"
                                href="https://x.com/?lang=hu">@Filmezz</a></li>
                    </ul>
                </div>
            </div>
            <p class="text-center m-0 py-4">Rácz Gergő & Maszlavér Bence &copy; Minden jog fenntartva!</p>
        </section>
    </footer>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/Profile.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
